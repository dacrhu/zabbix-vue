name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # a package-lock.json a .gitignore-ban van, ezért npm install
      - run: npm install

      - run: npm test

      - name: Build (${{ matrix.target }})
        run: npm run build
        env:
          TARGET: ${{ matrix.target }}

      - name: Zip build
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd dist && zip -r "../zabbix-vue-${VERSION}-${{ matrix.target }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: zabbix-vue-${{ matrix.target }}
          path: zabbix-vue-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zabbix-vue-*.zip
